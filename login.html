<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistem Informasi Produksi Heat Treatment</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/tables.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="ht-login-page">
    <div class="ht-login-card">
      <div class="ht-login-head">
        <div class="ht-login-logo">
          <img src="assets/logo/logo.svg" alt="Heat Treatment" class="icon icon-2xl">
        </div>
        <h1>Heat Treatment</h1>
        <p>Sistem Informasi Produksi</p>
      </div>
      <form id="loginForm" class="ht-login-form">
        <div class="ht-form-group">
          <label class="ht-form-label" for="username">Username</label>
          <input
            id="username"
            type="text"
            required
            autofocus
            class="ht-form-input"
            placeholder="admin"
          />
        </div>
        <div class="ht-form-group">
          <label class="ht-form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            required
            class="ht-form-input"
            placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          />
        </div>
        <div id="loginError" class="ht-login-error hidden"></div>
        <div class="ht-login-actions">
          <button type="submit" class="ht-btn ht-btn-primary">
            <img src="assets/icons/arrow-right.svg" alt="Masuk" class="icon">Masuk
          </button>
        </div>
      </form>
      <p class="ht-login-hint">
        Default: <span class="font-mono">admin</span> /
        <span class="font-mono">admin123</span>
      </p>
    </div>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
      Auth.initDefaultUser();
      if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
      }
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const errEl = document.getElementById("loginError");
        errEl.classList.add("hidden");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (Auth.login(username, password)) {
          window.location.href = "index.html";
        } else {
          errEl.textContent = "Username atau password salah!";
          errEl.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
