<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistem Informasi Produksi Heat Treatment</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div class="ht-login-card">
      <div class="text-center mb-8">
        <div class="ht-login-logo">
          <i class="fas fa-fire"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800">Heat Treatment</h1>
        <p class="text-xs text-slate-500 mt-1">
          Sistem Informasi Produksi
        </p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div class="ht-form-group">
          <label class="ht-form-label">Username</label>
          <input
            id="username"
            type="text"
            required
            autofocus
            class="ht-form-input"
            placeholder="admin"
          />
        </div>
        <div class="ht-form-group">
          <label class="ht-form-label">Password</label>
          <input
            id="password"
            type="password"
            required
            class="ht-form-input"
            placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          />
        </div>
        <div
          id="loginError"
          class="hidden text-sm text-danger-text bg-danger-bg px-3 py-2 rounded-lg"
        ></div>
        <button
          type="submit"
          class="ht-btn ht-btn-primary w-full"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>Masuk
        </button>
      </form>
      <p class="text-xs text-slate-400 text-center mt-4">
        Default: <span class="font-mono font-medium">admin</span> /
        <span class="font-mono font-medium">admin123</span>
      </p>
    </div>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
      Auth.initDefaultUser();
      if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
      }
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const errEl = document.getElementById("loginError");
        errEl.classList.add("hidden");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (Auth.login(username, password)) {
          window.location.href = "index.html";
        } else {
          errEl.textContent = "Username atau password salah!";
          errEl.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
