<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistem Informasi Produksi Heat Treatment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 mx-4">
      <div class="text-center mb-8">
        <div
          class="w-14 h-14 bg-orange-500 rounded-xl flex items-center justify-center mx-auto mb-4"
        >
          <i class="fas fa-fire text-white text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800">Heat Treatment</h1>
        <p class="text-xs text-slate-500 mt-1">Sistem Informasi Produksi</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1"
            >Username</label
          >
          <input
            id="username"
            type="text"
            required
            autofocus
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
            placeholder="admin"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1"
            >Password</label
          >
          <input
            id="password"
            type="password"
            required
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
            placeholder="••••••••"
          />
        </div>
        <div
          id="loginError"
          class="hidden text-sm text-red-500 bg-red-50 px-3 py-2 rounded-lg"
        ></div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm transition"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>Masuk
        </button>
      </form>
      <p class="text-xs text-slate-400 text-center mt-4">
        Default: <span class="font-mono font-medium">admin</span> /
        <span class="font-mono font-medium">admin123</span>
      </p>
    </div>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
      Auth.initDefaultUser();
      if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
      }
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const errEl = document.getElementById("loginError");
        errEl.classList.add("hidden");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (Auth.login(username, password)) {
          window.location.href = "index.html";
        } else {
          errEl.textContent = "Username atau password salah!";
          errEl.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
